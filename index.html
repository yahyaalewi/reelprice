<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>تحويل العملات العالمية بالأسماء</title>
<style>
* { box-sizing: border-box; font-family: Arial; }
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    direction: rtl;
}
.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 100%;
    max-width: 550px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
h2 { text-align: center; color: #203a43; }
input, select, button {
    width: 100%; padding: 12px; margin: 8px 0;
    font-size: 16px; border-radius: 8px; border: 1px solid #ccc;
}
button { background: #203a43; color: white; border: none; cursor: pointer; }
button:hover { background: #162b33; }
.result { margin-top: 15px; background: #f2f4f6; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
    <h2>🌍 تحويل العملات العالمية</h2>

    <input type="number" id="amount" placeholder="أدخل المبلغ">

    <select id="from"></select>
    <select id="to"></select>

    <button onclick="convert()">تحويل</button>

    <div class="result" id="result">النتيجة ستظهر هنا</div>
</div>

// تحميل العملات من API
async function loadCurrencies() {
    const res = await fetch("https://cdn.moneyconvert.net/api/latest.json");
    const data = await res.json();
    rates = data.rates;

    const fromSelect = document.getElementById("from");
    const toSelect = document.getElementById("to");

    for (let currency in rates) {
        const name = currencyNames[currency] || currency; // إذا غير موجود نعرض الرمز فقط
        let optionFrom = document.createElement("option");
        let optionTo = document.createElement("option");

        optionFrom.value = currency;
        optionFrom.textContent = name;

        optionTo.value = currency;
        optionTo.textContent = name;

        fromSelect.appendChild(optionFrom);
        toSelect.appendChild(optionTo);
    }

    fromSelect.value = "USD";
    toSelect.value = "EUR";
}

// دالة التحويل
function convert() {
    const amount = parseFloat(document.getElementById("amount").value);
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;

    if (!amount) {
        alert("أدخل مبلغًا صحيحًا");
        return;
    }

    const rate = rates[to] / rates[from];
    const result = amount * rate;

    const fromName = currencyNames[from] || from;
    const toName = currencyNames[to] || to;

    document.getElementById("result").innerHTML = `
        من <strong>${fromName}</strong> إلى <strong>${toName}</strong><br>
        ${amount} ${fromName} → ${result.toFixed(2)} ${toName}
    `;
}

loadCurrencies();
